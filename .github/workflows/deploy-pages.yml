name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare static site
        run: |
          test -s index.html
          test -s 404.html
          test -d assets
          test -d media
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R assets media _site/
          touch _site/.nojekyll
          test -s _site/index.html
          find _site/assets -type f -name '*.js' | grep -q .
          find _site/assets -type f -name '*.css' | grep -q .
          test -s _site/media/brand-mark.png

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
